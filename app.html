<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#14284b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="AVELORA"><title>AVELORA – Nursing Academy</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#faf6ec;--card:#fff;--ink:#14284b;--mut:#5d6b84;--gold:#b8924a;--line:#e8dfca;--ok:#2f7d57;--bad:#b23a3a;--navy:#14284b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--card:#16233b;--ink:#f1ead8;--mut:#9fb0cc;--line:#26365a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1626;--card:#16233b;--ink:#f1ead8;--mut:#9fb0cc;--line:#26365a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--navy);text-align:center;padding:14px 12px 12px;border-bottom:2px solid var(--gold)}
header b{display:block;color:#fff;font:600 24px Georgia,"Times New Roman",serif;letter-spacing:.32em;padding-left:.32em}
header small{color:var(--gold);font-size:10px;letter-spacing:.38em;font-weight:600}
main{max-width:760px;margin:auto;padding:16px 16px 110px}
h2{font:600 22px Georgia,serif;margin:6px 0 12px}h3{margin:18px 0 8px;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 12px;box-shadow:0 2px 10px rgba(20,40,75,.07)}
.hero{background:linear-gradient(135deg,#14284b,#23406f);color:#fff;border:0}.hero p{margin:4px 0;color:#e9e1cc}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(min-width:700px){.grid.g3{grid-template-columns:1fr 1fr 1fr}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;color:var(--ink);font:inherit;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(20,40,75,.06)}
.tile span{display:block;font-weight:400;font-size:13px;color:var(--mut)}.tile i{font:normal 600 20px Georgia,serif;color:var(--gold)}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0}.bar div{height:100%;background:linear-gradient(90deg,var(--gold),#e3c98d);border-radius:9px}
.btn{background:var(--navy);color:#fff;border:0;border-radius:14px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer}.btn.g{background:var(--gold)}.btn.o{background:none;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px;margin:4px 0 10px}
label{font-size:13px;color:var(--mut)}
.mod{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:8px;color:var(--ink);font:inherit;cursor:pointer}
.n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font:600 14px Georgia,serif}.n.d{background:var(--gold)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.opt.ok{border-color:var(--ok);background:rgba(47,125,87,.15)}.opt.bad{border-color:var(--bad);background:rgba(178,58,58,.14)}
.flip{perspective:900px;height:210px;margin:10px 0;cursor:pointer}.fi{position:relative;height:100%;transition:transform .5s;transform-style:preserve-3d}.flip.on .fi{transform:rotateY(180deg)}
.fc{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;display:grid;place-items:center;text-align:center;padding:20px;font:600 19px Georgia,serif;background:var(--card);border:1px solid var(--gold);box-shadow:0 4px 14px rgba(20,40,75,.1)}.fc.b{transform:rotateY(180deg);background:var(--navy);color:#fff;font:500 16px/1.5 inherit}
.tip{border-left:4px solid var(--gold);padding:6px 12px;background:rgba(184,146,74,.1);border-radius:0 10px 10px 0;margin:10px 0}
.mut{color:var(--mut);font-size:13px}.chat{max-height:50vh;overflow:auto}.msg{padding:10px 12px;border-radius:14px;margin:6px 0;white-space:pre-wrap}.u{background:var(--navy);color:#fff;margin-left:18%}.a{background:var(--card);border:1px solid var(--line);margin-right:10%}
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(20,40,75,.1)}
nav button{flex:1;background:none;border:0;color:var(--mut);font:inherit;font-size:11px;padding:4px;cursor:pointer}nav button svg{display:block;margin:0 auto 2px;width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}nav button.on{color:var(--gold);font-weight:700}
.vrow{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x mandatory}.vc{flex:none;width:148px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;color:var(--ink);text-decoration:none;font-weight:600;font-size:14px;box-shadow:0 2px 8px rgba(20,40,75,.06)}.vc i{display:grid;place-items:center;height:62px;border-radius:12px;background:linear-gradient(135deg,#14284b,#23406f);color:var(--gold);font-style:normal;font-size:24px;margin-bottom:8px}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:2px 14px;margin:8px 0}summary{font-weight:600;padding:11px 0;cursor:pointer}details[open] summary{color:var(--gold);border-bottom:1px solid var(--line);margin-bottom:6px}details p{margin:6px 0 10px}
</style></head><body>
<header><b>AVELORA</b><small>NURSING ACADEMY</small></header><main id="m"></main><nav id="nav"></nav>
<script>
const MODS=[
["PESR und Pflegeplanung","Die Pflegeplanung folgt dem Pflegeprozess: Informationssammlung (Anamnese), Probleme und Ressourcen erkennen, Ziele setzen, Maßnahmen planen, durchführen, evaluieren. PESR: P = Problem, E = Einflussfaktoren/Ursache (Ätiologie), S = Symptome, R = Ressourcen. Ziele werden nach SMART formuliert: spezifisch, messbar, attraktiv/akzeptiert, realistisch, terminiert.","Ohne Ressourcen keine gute Planung: Was kann die Person noch selbst?"],
["Vitalzeichen und Beobachtung","Richtwerte Erwachsene: Blutdruck um 120/80 mmHg (Hypertonie ab ≥140/90), Puls 60–100/min, Atemfrequenz 12–20/min, Temperatur 36,0–37,4 °C, SpO₂ 95–100 %. Dazu gehören Bewusstsein, Schmerz und Hautfarbe. Tachykardie = Puls >100, Bradykardie = Puls <60, Tachypnoe = Atemfrequenz >20.","Immer im Verlauf bewerten und Abweichungen melden und dokumentieren."],
["Fachsprache und medizinisches Wörterbuch","Dyspnoe = Atemnot · Zyanose = bläuliche Haut · Ikterus = Gelbfärbung · Ödem = Wassereinlagerung · Oligurie = stark verminderte Harnmenge · Dysphagie = Schluckstörung · Obstipation = Verstopfung · Hypoglykämie = Unterzucker · Aspiration = Eindringen von Fremdmaterial in die Atemwege. Vorsilben: hyper = über, hypo = unter, tachy = schnell, brady = langsam, -itis = Entzündung, -ämie = Blut.","Wortteile zerlegen: Vorsilbe + Stamm + Endung."],
["Medikamente und Dosierungen","6-R-Regel vor jeder Gabe: richtiger Patient, richtiges Medikament, richtige Dosierung, richtige Applikationsform, richtiger Zeitpunkt, richtige Dokumentation. Wirkstoffgruppen (z. B. Antihypertensiva, Diuretika, Analgetika, Antikoagulanzien) werden nach Wirkung, Nebenwirkung und Kontraindikation gelernt. Verordnung immer nur durch Ärztinnen/Ärzte; Rückfragen bei Unklarheit.","Im Zweifel nicht geben, sondern nachfragen (Vier-Augen-Prinzip)."],
["Anatomie und Physiologie","Organsysteme: Herz-Kreislauf, Atmung, Verdauung, Niere/Harnwege, Nerven, Hormone, Bewegungsapparat, Haut, Immunsystem. Pflegerisch wichtig: Funktion kennen, um Abweichungen zu erkennen (z. B. Niere = Ausscheidung und Blutdruckregulation).","Erst Normalzustand, dann Abweichung."],
["Krankheitsbilder und praktische Pflege","Jedes Krankheitsbild lernst du nach Schema: Definition, Ursachen, Symptome, Diagnostik, Therapie, Pflege, Beobachtung, Komplikationen, Prophylaxen. Beispiele: Diabetes mellitus (Blutzucker, Hypo-/Hyperglykämie), Herzinsuffizienz (Ödeme, Gewicht, Bilanz), COPD (Atemnot, Lippenbremse), Schlaganfall (FAST: Face, Arms, Speech, Time).","Bei Schlaganfall zählt jede Minute: sofort 112."],
["Pflegedokumentation und Kommunikation","Dokumentation: zeitnah, sachlich, nachvollziehbar, mit Handzeichen. Übergabe nach SBAR: Situation, Background (Hintergrund), Assessment (Einschätzung), Recommendation (Empfehlung). Kommunikation: aktives Zuhören, Ich-Botschaften, offene Fragen.","Was nicht dokumentiert ist, gilt rechtlich als nicht durchgeführt."],
["Notfallmanagement und Erste Hilfe","Prüfen – Rufen – Drücken: Ansprechen, Atmung prüfen (max. 10 s), Notruf 112, Herzdruckmassage in der Mitte des Brustkorbs, Frequenz 100–120/min, Tiefe etwa 5–6 cm, Verhältnis 30:2 bei Beatmung. Bei bewusstlosen Personen mit Atmung: stabile Seitenlage. Hausinterne Notfallpläne kennen.","Nicht abwarten – Hilfe holen und früh beginnen."],
["Hygiene und Infektionsschutz","Fünf Momente der Händedesinfektion: vor Patientenkontakt, vor aseptischen Tätigkeiten, nach Kontakt mit Körperflüssigkeiten, nach Patientenkontakt, nach Kontakt mit der Patientenumgebung. Einwirkzeit laut Herstellerangabe beachten. Schutzkleidung (Handschuhe, Kittel, Mund-Nasen-Schutz) je nach Risiko, Isolierung nach Hausstandard.","Handschuhe ersetzen keine Händedesinfektion."],
["Wundmanagement und Wundversorgung","Wundheilungsphasen: Reinigungs-/Exsudationsphase, Granulationsphase, Epithelisierungsphase. Beurteilen: Größe, Tiefe, Wundrand, Exsudat, Geruch, Schmerz. Aseptisches Vorgehen, Verbandwechsel nach ärztlicher Anordnung und Hausstandard. Dekubitus wird nach Kategorien 1–4 eingeteilt.","Wunde immer vor und nach Verbandwechsel beurteilen und dokumentieren."],
["Prophylaxen","Wichtige Prophylaxen: Dekubitus, Sturz, Thrombose, Pneumonie, Kontraktur, Aspiration, Soor/Parotitis, Obstipation, Intertrigo. Ablauf: Risiko einschätzen (z. B. Braden-Skala), Maßnahmen planen, Wirkung prüfen.","Prophylaxe beginnt mit der Risikoeinschätzung."],
["Körperpflege und Grundpflege","Ressourcenorientiert pflegen: Selbstständigkeit fördern, Intimsphäre schützen, Wünsche der Person beachten. Reihenfolge: von rein nach unrein, vom Gesicht zum Intimbereich. Haut beobachten (Rötung, Trockenheit, Druckstellen).","Pflege ist immer Beziehungsarbeit."],
["Ernährung, Flüssigkeit und Ausscheidung","Trinkmenge Erwachsene etwa 1,5–2 l/Tag, sofern keine Einschränkung angeordnet ist. Bilanz = Einfuhr minus Ausfuhr. BMI = Gewicht (kg) ÷ Größe² (m²). Beobachten: Stuhlgang, Urinmenge/-farbe, Schluckbeschwerden. Mangelernährung erkennen und melden.","Flüssigkeit und Ausscheidung immer gemeinsam betrachten."],
["Mobilisation, Transfer und Lagerung","Bewegungsförderung vor Hilfsmitteln. Rückengerechtes Arbeiten, Kinästhetik-Prinzipien, Lagerungswechsel nach individuellem Plan, 30°-Lagerung zur Druckentlastung. Transfer: Bremsen feststellen, Hilfsmittel prüfen, Schritte ankündigen.","Eigenschutz: Rücken schonen, Hilfsmittel nutzen."],
["Geriatrie, Demenz und Delir","Demenz: schleichend, meist fortschreitend, Gedächtnis und Orientierung. Delir: akut, schwankend, oft reversibel, mit Aufmerksamkeitsstörung und Verwirrtheit; Ursachen suchen (Infekt, Exsikkose, Medikamente, Operation). Bei Demenz: validierender, wertschätzender Umgang, feste Tagesstruktur.","Plötzliche Verwirrtheit immer ärztlich abklären lassen."],
["Pädiatrie und Kinderkrankenpflege","Vitalwerte sind altersabhängig (Säuglinge haben höhere Puls- und Atemfrequenzen). Kinder sind keine kleinen Erwachsenen: Dosierungen richten sich nach Gewicht und Alter. Bezugspersonen einbeziehen, altersgerecht erklären, auf Schmerzen und Dehydratation achten.","Immer Referenzwerte für die Altersgruppe verwenden."],
["Psychiatrie und psychische Erkrankungen","Wichtige Bilder: Depression, Angststörungen, Schizophrenie, Suchterkrankungen. Grundhaltung: wertschätzend, ruhig, verlässlich. Suizidgedanken immer ernst nehmen, direkt ansprechen und sofort das Team informieren.","Zuhören ist Pflegehandeln."],
["Medikamentenrechnung und Infusionen","Tropfen/min = Volumen (ml) × 20 ÷ Zeit (min) bei Standardbesteck (20 Tr = 1 ml). ml/h = Volumen ÷ Stunden. Tabletten = verordnete Dosis ÷ Dosis je Tablette. mg/kg: Dosis je kg × Körpergewicht. Prozent: 1 % = 1 g/100 ml. Nutze den Rechentrainer.","Einheiten immer mitrechnen und Ergebnis auf Plausibilität prüfen."],
["Recht, Ethik und Expertenstandards","Schweigepflicht, Einwilligung, Patientenverfügung, Betreuungsrecht, Pflegeberufegesetz (PflBG). Expertenstandards (DNQP) wie Dekubitusprophylaxe, Sturzprophylaxe, Schmerzmanagement sind evidenzbasierte Qualitätsvorgaben. Ethik: Autonomie, Fürsorge, Nicht-Schaden, Gerechtigkeit.","Maßnahmen ohne Einwilligung sind grundsätzlich Körperverletzung."],
["Aufnahme, Entlassung und Übergabe","Aufnahme: Begrüßung, Orientierung, Anamnese, Wertsachen, Dokumentation. Entlassung: Entlassbrief, Medikation, Hilfsmittel, Anschlussversorgung, Beratung der Angehörigen (Entlassmanagement). Übergabe strukturiert nach SBAR.","Gute Überleitung verhindert Informationsverlust."],
["Praktische Prüfungen und Examensvorbereitung","Praktische Prüfung: Informationen sammeln, Pflege planen, durchführen, evaluieren, Reflexionsgespräch. Tipps: Hygiene und Sicherheit immer sichtbar, Handlungsschritte begründen, Patientenorientierung zeigen, ruhig kommunizieren.","Begründe laut, was du tust – das zeigt Kompetenz."]];
const SUB={
1:[["Blutdruck (RR)","Definition::Druck des Blutes in den Arterien, angegeben als systolisch/diastolisch in mmHg.|Werte::Normal um 120/80, Hypertonie ab ≥140/90, Hypotonie etwa unter 100/60.|Messung::Nach 5 Minuten Ruhe, Manschette in Herzhöhe, passende Manschettenbreite, nicht am Arm mit Shunt, Infusion, Lähmung oder Lymphödem.|Typische Fehler::Zu schmale Manschette (Wert zu hoch), Messung direkt nach Anstrengung, Sprechen während der Messung.|Beobachten::Kopfschmerz, Schwindel, Sehstörungen, Nasenbluten; bei stark erhöhten Werten mit Beschwerden sofort Arzt informieren."],
["Puls","Messort::Meist Arteria radialis (Handgelenk), mit Zeige- und Mittelfinger, nie mit dem Daumen.|Zählen::30 Sekunden ×2; bei unregelmäßigem Puls volle 60 Sekunden.|Beurteilen::Frequenz (60–100/min), Rhythmus (regelmäßig/arrhythmisch), Qualität (kräftig, fadenförmig).|Abweichungen::Tachykardie >100/min, Bradykardie <60/min, Arrhythmie = unregelmäßig.|Prüfungstipp::Pulsdefizit = Unterschied zwischen Herzfrequenz (Herz hören) und tastbarem Puls."],
["Atmung","Normwert::12–20 Atemzüge/min beim Erwachsenen.|Beobachten::Frequenz, Tiefe, Rhythmus, Atemgeräusche (Stridor, Rasseln, Giemen), Einsatz der Atemhilfsmuskulatur, Zyanose.|Messung::Unbemerkt 60 Sekunden lang zählen, z. B. beim Pulsfühlen.|Begriffe::Dyspnoe = Atemnot, Tachypnoe = zu schnell, Bradypnoe = zu langsam, Apnoe = Atemstillstand, Orthopnoe = Atemnot im Liegen.|Maßnahmen::Oberkörper hoch, Fenster öffnen, ruhig bleiben, Arzt informieren, ggf. Sauerstoff nach Anordnung."],
["Körpertemperatur","Werte::Normal 36,0–37,4 °C; subfebril 37,5–38,0 °C; Fieber über 38,0 °C; hohes Fieber über 39 °C.|Messorte::Oral, axillär (ca. 0,5 °C niedriger), rektal (höher), Ohr, Stirn; immer gleichen Messort im Verlauf nutzen.|Fieberphasen::Anstieg (Frösteln, Schüttelfrost), Fieberhöhe (warm, gerötet), Abfall (Schwitzen).|Pflege::Flüssigkeit anbieten, leichte Bedeckung, Ruhe, Mundpflege, Wadenwickel nur nach Anordnung und bei warmen Extremitäten; nicht bei Schüttelfrost.|Hypothermie::Unter 35 °C, langsam wärmen, Arzt informieren."],
["Sauerstoffsättigung und Bewusstsein","SpO₂::Normal 95–100 %; unter 90 % kritisch, sofort melden. Bei COPD gelten oft andere Zielwerte nach Anordnung.|Fehlerquellen::Kalte Finger, Nagellack, Bewegung, Kreislaufzentralisation.|Bewusstsein::Wach (klar), somnolent (schläfrig, erweckbar), soporös (nur auf starke Reize), komatös (nicht erweckbar). Genauere Bewertung mit der Glasgow Coma Scale (GCS).|Orientierung::Zu Person, Ort, Zeit und Situation prüfen."]],
7:[["Reanimation (BLS)","Ablauf::Ansprechen und schütteln, Atmung prüfen (max. 10 s), Notruf 112 bzw. Reanimationsteam, sofort Herzdruckmassage.|Technik::Druckpunkt Mitte des Brustkorbs, Tiefe 5–6 cm, Frequenz 100–120/min, volle Entlastung, 30:2 mit Beatmung.|AED::Sobald verfügbar einschalten und Anweisungen folgen.|Typische Fehler::Zu spät beginnen, zu flach drücken, lange Unterbrechungen.|Merksatz::Prüfen – Rufen – Drücken."],
["Stabile Seitenlage","Indikation::Bewusstlose Person mit normaler Atmung.|Ziel::Atemwege freihalten, Aspiration von Erbrochenem verhindern.|Durchführung::Arm nah am Körper angewinkelt nach oben, entfernten Arm über die Brust, entferntes Bein anwinkeln, zu sich ziehen, Kopf überstrecken, Mund leicht nach unten.|Danach::Atmung und Bewusstsein ständig kontrollieren, Notruf."],
["Herzinfarkt und Schlaganfall","Herzinfarkt::Druck oder Schmerz hinter dem Brustbein, Ausstrahlung in Arm, Kiefer oder Oberbauch, Schweiß, Angst, Übelkeit; bei Frauen oft untypisch.|Maßnahmen Herzinfarkt::112, Oberkörper hochlagern, beruhigen, einengende Kleidung öffnen, Vitalzeichen, nicht allein lassen.|Schlaganfall::FAST: Face (Gesicht hängt), Arms (Arm sinkt ab), Speech (Sprachstörung), Time (sofort 112, Zeitpunkt notieren).|Merksatz::Zeit ist Gehirn bzw. Herzmuskel."],
["Hypoglykämie","Zeichen::Schwitzen, Zittern, Heißhunger, Unruhe, Verwirrtheit, später Bewusstlosigkeit.|Wach und schluckfähig::Schnell wirksame Kohlenhydrate (Traubenzucker, Saft), Blutzucker kontrollieren, Arzt informieren.|Bewusstlos::Notruf, Seitenlage, nichts in den Mund geben.|Ursachen::Zu viel Insulin, zu wenig gegessen, ungewohnte Anstrengung."]],
8:[["Händedesinfektion","Menge::Eine Hohlhand voll Mittel, alle Flächen einreiben (Handflächen, Handrücken, Fingerzwischenräume, Daumen, Fingerkuppen, Nagelfalz).|Dauer::Einwirkzeit laut Hersteller, meist 30 Sekunden; Hände bleiben feucht.|Regeln::Kein Schmuck, keine Uhr, kurze Nägel, kein Nagellack.|Wichtig::Bei sichtbarer Verschmutzung erst waschen, dann desinfizieren.|Besonderheit::Bei Noro und Clostridioides difficile reicht alkoholische Desinfektion allein nicht, zusätzlich Händewaschen nach Hausstandard."],
["Schutzkleidung und Isolierung","Anlegen::Händedesinfektion, Kittel, Mund-Nasen-Schutz, Handschuhe.|Ablegen::Handschuhe, Händedesinfektion, Kittel, Mund-Nasen-Schutz, erneute Händedesinfektion.|Standardhygiene::Gilt bei allen Personen, bei Verdacht oder Nachweis (z. B. MRSA, Noro) zusätzlich Isolierung nach Hausstandard.|Entsorgung::Spitze Gegenstände sofort in den Abwurfbehälter, nicht zurückstecken (kein Recapping)."]],
9:[["Wundheilungsphasen","Reinigungsphase::Etwa Tag 1–3, Blutstillung, Entzündung, Wundreinigung.|Granulationsphase::Etwa Tag 4–10, neues rotes Gewebe füllt die Wunde.|Epithelisierungsphase::Ab etwa Tag 7–10, Haut wächst vom Rand her zu, Narbenbildung.|Störfaktoren::Infektion, Durchblutungsstörung, Diabetes, Mangelernährung, Rauchen.|Infektionszeichen::Rötung, Schwellung, Überwärmung, Schmerz, eitriges Sekret, Geruch, Fieber."],
["Chronische Wunden","Ulcus cruris venosum::Venöse Stauung, Schwellung, bräunliche Haut, Wunde meist am Innenknöchel; Kompression nach Anordnung, Beine hochlagern.|Ulcus cruris arteriosum::Durchblutungsstörung, kalte blasse Haut, starke Schmerzen, Wunde an Zehen, Ferse; keine Kompression.|Diabetischer Fuß::Nervenschäden, Druckstellen bleiben unbemerkt; tägliche Fußinspektion, gutes Schuhwerk, keine Barfußwege."],
["Verbandwechsel","Vorbereitung::Anordnung prüfen, Händedesinfektion, Material richten, Patient informieren, ggf. Schmerzmittel vorher.|Durchführung::Alten Verband mit Handschuhen entfernen, Wunde beurteilen, Händedesinfektion, steril arbeiten (No-Touch-Technik), Wundauflage nach Anordnung.|Nachbereitung::Abfall richtig entsorgen, Wunde dokumentieren (Größe, Aussehen, Exsudat, Schmerz), ggf. Foto nach Hausstandard."]],
10:[["Dekubitusprophylaxe","Definition::Lokal begrenzte Schädigung von Haut und Gewebe durch Druck und/oder Scherkräfte.|Gefährdete Stellen::Kreuzbein, Fersen, Trochanter, Sitzbeine, Knöchel, Hinterkopf.|Risiko::Immobilität, Inkontinenz, Mangelernährung, Sensibilitätsstörung, hohes Alter; Einschätzung z. B. mit der Braden-Skala.|Kategorien::1 = nicht wegdrückbare Rötung, 2 = Blase oder Teilverlust der Haut, 3 = Verlust aller Hautschichten, 4 = Gewebeverlust bis Muskel oder Knochen.|Maßnahmen::Individueller Bewegungsplan, 30°-Lagerung, Mikrolagerung, Fersen freilagern, Haut täglich inspizieren, Haut pflegen, Inkontinenz versorgen, Ernährung und Flüssigkeit sichern, druckverteilende Hilfsmittel, Scherkräfte vermeiden.|Typische Fehler::Rötung massieren, Ringkissen, Fönen, Fersen nur polstern.|Standard::DNQP-Expertenstandard Dekubitusprophylaxe."],
["Sturzprophylaxe","Definition::Unbeabsichtigtes Zubodengelangen.|Risiko::Hohes Alter, Gangunsicherheit, Schwindel, Seh- oder Hörstörung, Demenz, Inkontinenz/Harndrang, Medikamente (Sedativa, Antihypertensiva, Diuretika), ungeeignete Schuhe.|Maßnahmen::Risiko bei Aufnahme und bei Veränderung einschätzen, Umgebung anpassen (Licht, niedriges Bett, Bremsen, Klingel in Reichweite), Kraft- und Balancetraining, Hilfsmittel, festes Schuhwerk, Toilettengänge begleiten, Medikamente ärztlich prüfen lassen.|Wichtig::Bettgitter sind kein Sturzschutz, sondern freiheitsentziehend und brauchen Einwilligung bzw. Genehmigung.|Nach Sturz::Vitalzeichen, Arzt informieren, Verletzungen prüfen, Ursache klären, dokumentieren.|Standard::DNQP-Expertenstandard Sturzprophylaxe."],
["Thromboseprophylaxe","Definition::Gerinnsel in einer Vene, meist im Bein (tiefe Beinvenenthrombose).|Risiko::Immobilität, Operation, Alter, Übergewicht, Flüssigkeitsmangel, Tumor, Schwangerschaft.|Maßnahmen::Frühmobilisation, Bewegungsübungen, Beine hochlagern, ausreichend trinken, Kompression (Strümpfe, Wickeln) und Medikamente (z. B. Heparin) nur nach Anordnung.|Symptome::Einseitige Schwellung, Schmerz, Überwärmung, Spannungsgefühl.|Komplikation::Lungenembolie mit plötzlicher Atemnot und Brustschmerz, Notfall.|Fehler::Betroffenes Bein massieren."],
["Pneumonieprophylaxe","Risiko::Bettlägerigkeit, flache Atmung, Schmerzen, Schluckstörung, COPD, Beatmung.|Maßnahmen::Atemübungen (tiefes Atmen, Lippenbremse), Oberkörperhochlage, frühe Mobilisation, Atemstimulierende Einreibung (ASE), Mundpflege, ausreichend Flüssigkeit zur Sekretlösung, Inhalation nach Anordnung.|Warnzeichen::Husten, Fieber, Atemnot, verfärbtes Sekret, erhöhte Atemfrequenz."],
["Kontrakturenprophylaxe","Definition::Dauerhafte Bewegungseinschränkung eines Gelenks durch verkürzte Muskeln, Sehnen oder Kapseln.|Maßnahmen::Gelenke aktiv und passiv im schmerzfreien Bereich durchbewegen, Lagerung in Funktionsstellung, Fußstütze gegen Spitzfuß, Mobilisation, Zusammenarbeit mit Physiotherapie.|Fehler::Gelenke mit Gewalt bewegen, lange in Zwangshaltung lagern."],
["Aspirationsprophylaxe","Risiko::Dysphagie (Schluckstörung), Schlaganfall, Demenz, verminderte Wachheit, Sondenernährung.|Maßnahmen::Aufrecht sitzen beim Essen und 30 Minuten danach, Ruhe, kleine Portionen, Konsistenz anpassen (z. B. angedickt), Kopf leicht vorneigen, Mundpflege, Logopädie, bei Sondenkost Oberkörper mindestens 30° hoch.|Warnzeichen::Husten, Räuspern, nasse Stimme, Verschlucken, Fieber.|Notfall::Bei Verlegung der Atemwege zum Husten auffordern, Hilfe holen, Schläge zwischen die Schulterblätter, ggf. Heimlich-Handgriff."],
["Soor- und Parotitisprophylaxe","Soor::Pilzinfektion (Candida) der Mundschleimhaut mit abwischbaren weißen Belägen.|Parotitis::Entzündung der Ohrspeicheldrüse bei vermindertem Speichelfluss und fehlendem Kauen.|Maßnahmen::Mundpflege nach den Mahlzeiten, Zahnprothese reinigen, Kauen anregen (Brot, Obst), Speichelfluss fördern, ausreichend trinken, Mundschleimhaut täglich inspizieren."],
["Obstipationsprophylaxe","Definition::Stuhlgang seltener als dreimal pro Woche oder erschwert und hart.|Maßnahmen::Ausreichend trinken, ballaststoffreiche Ernährung, Bewegung, feste Toilettenzeiten, Privatsphäre, Fußhocker (Hockstellung), Bauchmassage im Uhrzeigersinn, Medikamente prüfen lassen (z. B. Opioide).|Warnzeichen::Starke Bauchschmerzen, Erbrechen, Stuhlverhalt, aufgeblähter Bauch, dann sofort Arzt informieren."],
["Intertrigoprophylaxe","Definition::Hautentzündung in Hautfalten durch Feuchtigkeit und Reibung.|Gefährdete Stellen::Unter der Brust, Leisten, Achseln, Bauchfalten.|Maßnahmen::Falten sauber und trocken halten, gründlich abtrocknen, atmungsaktive Baumwollkleidung, Feuchtigkeit vermeiden."]]};

0:[["Pflegeprozess in 6 Schritten","1::Informationen sammeln (Pflegeanamnese)|2::Probleme und Ressourcen erkennen|3::Pflegeziele festlegen|4::Maßnahmen planen|5::Maßnahmen durchführen|6::Evaluation: Wurde das Ziel erreicht? Dann anpassen oder beenden.|Merksatz::Der Pflegeprozess ist ein Kreislauf, kein einmaliger Plan."],["PESR-Schema","P (Problem)::Was ist das Pflegeproblem? Beispiel: Sturzgefahr.|E (Einflussfaktoren)::Ursachen, z. B. Gangunsicherheit, Medikamente.|S (Symptome)::Woran erkenne ich das Problem? Beispiel: unsicherer Gang, Schwindel.|R (Ressourcen)::Was kann die Person? Beispiel: nutzt den Rollator sicher, ist motiviert."],["SMART-Ziele","S::spezifisch (genau beschrieben)|M::messbar|A::akzeptiert und attraktiv für die Person|R::realistisch|T::terminiert|Beispiel::Frau M. geht bis zum 20.11. mit Rollator 20 m ohne Hilfsperson."]],
2:[["Atmung und Herz-Kreislauf","Dyspnoe::Atemnot|Tachypnoe::zu schnelle Atmung|Bradypnoe::zu langsame Atmung|Apnoe::Atemstillstand|Zyanose::Blaufärbung der Haut|Sputum::Auswurf|Tachykardie::Herzfrequenz über 100/min|Bradykardie::Herzfrequenz unter 60/min|Arrhythmie::unregelmäßiger Herzschlag|Hypertonie::Bluthochdruck|Hypotonie::niedriger Blutdruck|Thrombose::Blutgerinnsel in einer Vene|Embolie::Gefäßverschluss durch verschlepptes Material|Ödem::Wassereinlagerung im Gewebe",1],["Haut und Wunde","Dekubitus::Druckgeschwür|Ikterus::Gelbfärbung der Haut|Erythem::Hautrötung|Exsikkose::Austrocknung|Pruritus::Juckreiz|Hämatom::Bluterguss|Exsudat::Wundflüssigkeit|Ulcus::Geschwür|Abszess::Eiteransammlung|Inkontinenz::Unfähigkeit, Urin oder Stuhl zu halten",1],["Verdauung und Ausscheidung","Obstipation::Verstopfung|Diarrhö::Durchfall|Emesis::Erbrechen|Nausea::Übelkeit|Meläna::Teerstuhl (Blut im Stuhl)|Dysphagie::Schluckstörung|Aszites::Bauchwassersucht|Oligurie::stark verminderte Harnmenge|Anurie::fast keine Harnausscheidung|Polyurie::stark vermehrte Harnmenge|Dysurie::schmerzhaftes Wasserlassen|Hämaturie::Blut im Urin",1],["Stoffwechsel, Nerven, Allgemeines","Hyperglykämie::zu hoher Blutzucker|Hypoglykämie::zu niedriger Blutzucker|Dehydratation::Flüssigkeitsmangel|Kachexie::starke Auszehrung|Adipositas::starkes Übergewicht|Delir::akute Verwirrtheit|Demenz::fortschreitender Verlust geistiger Fähigkeiten|Vigilanz::Wachheit|Aphasie::Sprachstörung|Parese::Teillähmung|Plegie::vollständige Lähmung|Hemiparese::halbseitige Schwäche",1],["Vorsilben und Endungen","hyper-::über, zu viel|hypo-::unter, zu wenig|tachy-::schnell|brady-::langsam|a- / an-::ohne, nicht|dys-::gestört, schwer|poly-::viel|olig-::wenig|-itis::Entzündung|-ämie::Blut|-urie::Harn|-pathie::Erkrankung|-ektomie::operative Entfernung|-skopie::Spiegelung",1]],
3:[["6-R-Regel","1::richtiger Patient|2::richtiges Medikament|3::richtige Dosierung|4::richtige Applikationsform|5::richtiger Zeitpunkt|6::richtige Dokumentation|Wichtig::Vor jeder Gabe prüfen: Anordnung, Name, Verfallsdatum, Allergien."],["Applikationsformen","oral::über den Mund (Tablette, Saft)|sublingual::unter der Zunge|s.c.::unter die Haut (z. B. Insulin, Heparin)|i.m.::in den Muskel|i.v.::in die Vene|transdermal::über die Haut (Pflaster)|inhalativ::über die Atemwege|rektal::über den Enddarm",1],["Wichtige Medikamentengruppen","Analgetika::Schmerzmittel|Antihypertensiva::senken den Blutdruck|Diuretika::fördern die Harnausscheidung|Antikoagulanzien::hemmen die Blutgerinnung|Antibiotika::wirken gegen Bakterien|Antidiabetika / Insulin::senken den Blutzucker|Sedativa::beruhigend, dämpfend|Laxanzien::Abführmittel",1],["Medikamentensicherheit","Regel::Nur nach ärztlicher Anordnung geben, bei Unklarheit nachfragen.|Fehlerquellen::Verwechslung ähnlich klingender Namen, Ablenkung, falscher Patient.|Vier-Augen-Prinzip::Hochrisikomedikamente zu zweit prüfen.|Dokumentieren::Gabe, Uhrzeit, Besonderheiten, Verweigerung."]],
4:[["Herz-Kreislauf-System","Aufgabe::Das Herz pumpt Blut durch den Körper, das Blut transportiert Sauerstoff und Nährstoffe.|Aufbau::Vier Räume: rechter und linker Vorhof, rechte und linke Kammer. Herzklappen wirken als Ventile.|Lungenkreislauf::Rechte Kammer → Lunge → linker Vorhof.|Körperkreislauf::Linke Kammer → Aorta → Körper → Hohlvenen → rechter Vorhof.|Gefäße::Arterien führen vom Herzen weg, Venen zum Herzen hin, Kapillaren tauschen Stoffe aus.|Pflege::Puls, Blutdruck, Ödeme, Hautfarbe beobachten."],["Atmungssystem","Weg der Luft::Nase → Rachen → Kehlkopf → Luftröhre → Bronchien → Lungenbläschen (Alveolen).|Aufgabe::Sauerstoff aufnehmen, Kohlendioxid abgeben.|Pflege::Atemfrequenz, Atemgeräusche, SpO₂, Husten, Sputum beobachten."],["Verdauungssystem","Weg::Mund → Speiseröhre → Magen → Dünndarm → Dickdarm → Enddarm.|Organe::Leber (Stoffwechsel, Galle), Bauchspeicheldrüse (Verdauungsenzyme, Insulin).|Pflege::Ernährung, Stuhlgang, Übelkeit, Erbrechen, Bauchumfang beobachten."],["Niere und Harnwege","Weg::Nieren → Harnleiter → Blase → Harnröhre.|Aufgaben::Ausscheidung, Flüssigkeits- und Salzhaushalt, Blutdruckregulation.|Pflege::Urinmenge, -farbe, -geruch, Bilanz, Schmerzen beim Wasserlassen."],["Nervensystem und Hormone","ZNS::Gehirn und Rückenmark steuern Denken und Bewegung.|PNS::Nerven leiten Signale zwischen Körper und ZNS.|Hormone::Botenstoffe, z. B. Insulin (Blutzucker), Schilddrüsenhormone (Stoffwechsel).|Pflege::Bewusstsein, Orientierung, Lähmungen, Sprache beobachten."]],
5:[["Diabetes mellitus","Definition::Stoffwechselerkrankung mit erhöhtem Blutzucker.|Typen::Typ 1 (Insulinmangel), Typ 2 (Insulinresistenz).|Symptome::Durst, häufiges Wasserlassen, Müdigkeit.|Pflege::Blutzucker messen, Insulin nach Anordnung, Fußkontrolle, Ernährung.|Notfälle::Hypoglykämie (Zittern, Schwitzen) und Hyperglykämie (Durst, Verwirrtheit)."],["Arterielle Hypertonie","Definition::Dauerhaft erhöhter Blutdruck (ab ≥140/90 mmHg).|Folgen::Herzinfarkt, Schlaganfall, Nierenschäden.|Pflege::Regelmäßig messen, Salz reduzieren, Bewegung, Medikamente nach Anordnung."],["Herzinsuffizienz","Definition::Das Herz pumpt zu wenig Blut.|Symptome::Atemnot, Ödeme in den Beinen, Gewichtszunahme, Müdigkeit.|Pflege::Täglich wiegen, Bilanzieren, Beine hochlagern, Oberkörper hoch."],["COPD","Definition::Chronische Verengung der Atemwege, meist durch Rauchen.|Symptome::Husten, Auswurf, Atemnot.|Pflege::Lippenbremse, Atemübungen, Oberkörper hoch, Infektionen vermeiden."],["Schlaganfall","Ursache::Durchblutungsstörung oder Blutung im Gehirn.|Erkennen::FAST-Test.|Pflege::Notruf, Vitalzeichen, Aspirations- und Dekubitusprophylaxe, Frühmobilisation."]],
6:[["Dokumentationsregeln","Zeitnah::Direkt nach der Maßnahme.|Sachlich::Beobachtung statt Wertung.|Nachvollziehbar::Datum, Uhrzeit, Handzeichen.|Wichtig::Nicht dokumentiert = rechtlich nicht erfolgt."],["SBAR-Übergabe","S::Situation: Wer? Was ist aktuell los?|B::Background: Vorgeschichte, Diagnosen.|A::Assessment: Meine Einschätzung (Vitalwerte, Beobachtungen).|R::Recommendation: Was brauche ich, was schlage ich vor?"],["Kommunikation","Aktiv zuhören::Blickkontakt, Nachfragen, Zusammenfassen.|Ich-Botschaften::„Ich mache mir Sorgen“ statt Vorwürfe.|Offene Fragen::„Wie geht es Ihnen?“ statt Ja/Nein-Fragen."]],
12:[["Flüssigkeit und Bilanz","Bedarf::Etwa 1,5–2 l pro Tag.|Bilanz::Einfuhr minus Ausfuhr.|Dehydratation::trockene Haut, Schleimhaut, dunkler Urin, Verwirrtheit.|Maßnahmen::Trinkplan, Lieblingsgetränke anbieten, Trinken anreichen."],["Ernährung und BMI","BMI::Gewicht (kg) ÷ Größe² (m²).|Normal::18,5–24,9.|Mangelernährung::ungewollter Gewichtsverlust, Appetitlosigkeit melden."],["Ausscheidung","Beobachten::Menge, Farbe, Geruch, Häufigkeit.|Inkontinenz::Ursache klären, Toilettentraining, Hilfsmittel, Haut schützen."]],
13:[["Rückengerechtes Arbeiten","Prinzipien::Bett auf Arbeitshöhe, breiter Stand, Last nah am Körper, Beine statt Rücken nutzen, Hilfsmittel einsetzen.|Fehler::Heben mit rundem Rücken, Drehen mit Last."],["Lagerungen","30°-Lagerung::Seitenlage, Entlastung von Kreuzbein und Trochanter.|Oberkörperhochlagerung::bei Atemnot und Herzinsuffizienz.|Wichtig::Lagerung nach individuellem Plan, Haut kontrollieren."],["Transfer","Schritte::Information, Bremsen fest, Hilfsmittel prüfen, Kommando, gemeinsam bewegen.|Sicherheit::Schuhe, rutschfester Untergrund, Sturzgefahr beachten."]],
14:[["Demenz","Merkmale::Schleichend, fortschreitend, Gedächtnis- und Orientierungsverlust.|Umgang::Ruhig, einfache Sätze, Tagesstruktur, wertschätzend, nicht korrigieren."],["Delir","Merkmale::Akut, schwankend, Aufmerksamkeitsstörung, oft reversibel.|Ursachen::Infekt, Exsikkose, Medikamente, Operation.|Maßnahmen::Arzt informieren, Orientierung geben, Brille und Hörgerät, Reizarmut, Trinken."]],
17:[["Tropfen pro Minute","Formel::Volumen (ml) × 20 ÷ Zeit (min).|Beispiel::500 ml in 4 h → 500 × 20 ÷ 240 ≈ 42 Tr/min."],["ml pro Stunde","Formel::Volumen ÷ Stunden.|Beispiel::1000 ml in 8 h → 125 ml/h."],["Tabletten","Formel::Verordnete Dosis ÷ Dosis je Tablette.|Beispiel::40 mg verordnet, Tablette 20 mg → 2 Tabletten."],["mg pro kg und Prozent","mg/kg::Dosis je kg × Körpergewicht (z. B. 5 mg × 60 kg = 300 mg).|Prozent::1 % = 1 g in 100 ml = 10 mg/ml."]],
18:[["Schweigepflicht und Einwilligung","Schweigepflicht::Informationen über Patienten nur an Berechtigte.|Einwilligung::Jede Maßnahme braucht Zustimmung nach Aufklärung.|Patientenverfügung::schriftlicher Wille für den Fall der Einwilligungsunfähigkeit."],["Expertenstandards (DNQP)","Bedeutung::Evidenzbasierte Qualitätsvorgaben der Pflege.|Beispiele::Dekubitusprophylaxe, Sturzprophylaxe, Schmerzmanagement, Kontinenzförderung."],["Ethik","Vier Prinzipien::Autonomie, Fürsorge, Nichtschaden, Gerechtigkeit.|Praxis::Wünsche respektieren, im Team besprechen, bei Konflikten ethische Fallbesprechung."]]});

prog(){const t=Object.keys(S.tasks).filter(k=>S.tasks[k]===true).length;return `<h2>Fortschritt</h2><div class="card"><b>Ausbildungsfortschritt</b>${bar(pct())}<p class="mut">${Object.keys(S.done).length} von 21 Modulen abgeschlossen</p></div><div class="grid"><div class="card"><i style="font:600 26px Georgia">${S.quiz.length}</i><br>Quizze erledigt</div><div class="card"><i style="font:600 26px Georgia">${known()}</i><br>Karten gewusst</div><div class="card"><i style="font:600 26px Georgia">${S.mins}</i><br>Minuten Lernzeit</div><div class="card"><i style="font:600 26px Georgia">${t}/7</i><br>Wochenaufgaben</div></div><div class="card"><b>Prüfungsvorbereitung</b>${bar(avg())}<p class="mut">Ø ${avg()} % in Quizzen</p></div><div class="card"><b>Erfolge</b><p>${[Object.keys(S.done).length>=1&&"🏅 Erstes Modul",S.quiz.length>=3&&"🏅 3 Quizze",known()>=10&&"🏅 10 Karten",avg()>=80&&"🏅 Quiz-Profi"].filter(Boolean).join(" · ")||"Noch keine – leg los!"}</p></div>`},
prof(){const f=(k,l,t="text")=>`<label>${l}</label><input type="${t}" value="${E(S[k])}" onchange="S.${k}=this.value;save()">`;return `<h2>Profil</h2><div class="card">${f("name","Name")}${f("prof","Ausbildungsberuf")}${f("year","Ausbildungsjahr")}${f("start","Ausbildungsbeginn","date")}${f("school","Pflegeschule")}${f("einsatz","Aktueller Praxiseinsatz")}<label>Persönliche Lernziele</label><textarea rows="3" onchange="S.ziel=this.value;save()">${E(S.ziel)}</textarea><p class="mut">Gespeichert auf diesem Gerät.</p></div><div class="row"><button class="btn g" onclick="go('plan')">Wochenplan</button><button class="btn g" onclick="go('ai')">KI-Assistent</button><button class="btn o" onclick="go('about')">Über AVELORA</button></div>`},
about(){return `${back("prof")}<div class="card hero" style="margin-top:14px"><h2 style="margin-top:0">Über AVELORA</h2><p>AVELORA Nursing Academy ist eine digitale Lernplattform für die generalistische Pflegeausbildung. Sie verbindet fundiertes Pflegewissen, praktische Übungen, interaktive Lernmethoden und intelligente Lernunterstützung. Unser Ziel ist es, Auszubildende auf ihrem Weg zu kompetenten und selbstbewussten Pflegefachkräften zu begleiten.</p><p><b>Wissen. Pflege. Kompetenz.</b></p></div>`},
ai(){return `${back("home")}<h2 style="margin-top:14px">KI-Lernassistent</h2><div class="card"><div class="chat" id="ch">${hist.map(h=>`<div class="msg ${h.role=="user"?"u":"a"}">${E(h.content)}</div>`).join("")||'<p class="mut">Frag mich z. B. „Erkläre PESR an einem Beispiel“ oder „Erstelle 3 Prüfungsfragen zu COPD“.</p>'}</div><textarea id="aq" rows="2" placeholder="Deine Frage …">${A!=null?"Erkläre mir das Modul: "+MODS[A][0]:""}</textarea><button class="btn" id="ab" onclick="ask()">Senden</button></div><p class="mut">Die KI ersetzt keine Fachaufsicht. Keine Dosierungsempfehlungen für reale Patienten.</p>`}};
const VID=[["Grundlagen",["Blutdruck messen","Puls messen","Atemfrequenz messen","Temperatur messen","Pflegeplanung PESR","SBAR Übergabe"]],["Prophylaxen",["Dekubitusprophylaxe","Sturzprophylaxe","Thromboseprophylaxe","Pneumonieprophylaxe","Aspirationsprophylaxe","Kontrakturenprophylaxe"]],["Hygiene und Wunden",["Händedesinfektion","Schutzkleidung anlegen","Verbandwechsel","Wundheilung"]],["Notfall",["Reanimation Ablauf","Stabile Seitenlage","Hypoglykämie Notfall","Schlaganfall FAST"]],["Anatomie",["Herz Kreislauf","Atmungssystem","Verdauungssystem","Niere und Harnwege"]],["Rechnen",["Infusion Tropfen pro Minute","Medikamentenrechnung","Dreisatz Pflege"]]];
VW.videos=()=>`${back()}<h2 style="margin-top:14px">Erklärvideos</h2><p class="mut">Die Videos öffnen sich auf YouTube (Suche zum Thema). Bewerte Quellen kritisch und gleiche sie mit deinem Unterricht ab.</p>${VID.map(([c,l])=>`<h3>${c}</h3><div class="vrow">${l.map(t=>`<a class="vc" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(t+' Pflege Ausbildung')}"><i>▶</i>${t}</a>`).join("")}</div>`).join("")}`;
function mk(s){S.cards[C.i]=s;C.i=(C.i+1)%CARDS.length;C.flip=false;save();render()}
function qs(){let p=QZ.filter(x=>!Q.l||x[5]==Q.l);if(!p.length)p=QZ;let l=[];while(l.length<Q.n)l=l.concat([...p].sort(()=>Math.random()-.5));R={l:l.slice(0,Q.n),i:0,a:[]};go("quizrun")}
let ti;function tmr(){clearInterval(ti);if(!Q.t||R.a[R.i]!=null)return;let s=30;const e=document.getElementById("tm");const f=()=>{if(!document.getElementById("tm")){clearInterval(ti);return}document.getElementById("tm").textContent="⏱ "+s;if(s--<=0){clearInterval(ti);qa(-1)}};f();ti=setInterval(f,1000)}
function qa(j){clearInterval(ti);R.a[R.i]=j;if(!Q.imm)qn();else render()}
function qn(){if(R.i+1<R.l.length){R.i++;render();return}const ok=R.l.filter((x,i)=>R.a[i]==x[2]).length;S.quiz.push({d:Date.now(),p:Math.round(ok/R.l.length*100)});save();go("quizres")}
function nc(){const t=Math.floor(Math.random()*4),r=a=>a[Math.floor(Math.random()*a.length)];if(t==0){const v=r([250,500,1000]),h=r([2,4,5,8]),a=Math.round(v*20/(h*60));K={q:`${v} ml Infusion sollen in ${h} Stunden laufen (20 Tr/ml). Wie viele Tropfen pro Minute?`,u:"Tr/min",a,s:`${v} × 20 ÷ (${h} × 60) = ${a} Tr/min (gerundet)`,tol:1}}else if(t==1){const v=r([500,1000,1500]),h=r([4,5,6,10]);K={q:`${v} ml sollen in ${h} Stunden laufen. Wie viele ml pro Stunde?`,u:"ml/h",a:v/h,s:`${v} ÷ ${h} = ${v/h} ml/h`,tol:.5}}else if(t==2){const o=r([20,40,60,100]),tb=r([10,20,40]);K={q:`Übung: Verordnet sind ${o} mg, eine Tablette enthält ${tb} mg. Wie viele Tabletten?`,u:"Tabletten",a:o/tb,s:`${o} ÷ ${tb} = ${o/tb} Tabletten`,tol:.01}}else{const w=r([50,60,75,80]),d=r([2,5,10]);K={q:`Übung: ${d} mg/kg bei ${w} kg Körpergewicht. Wie viele mg?`,u:"mg",a:w*d,s:`${d} × ${w} = ${w*d} mg`,tol:.01}}}
function cc(){const v=parseFloat(document.getElementById("ans").value),ok=Math.abs(v-K.a)<=K.tol;document.getElementById("rs").innerHTML=`<div class="tip">${ok?"✅ Richtig!":"❌ Nicht ganz."}<br>Lösungsweg: ${K.s}</div>`}
async function ask(){const ta=document.getElementById("aq"),t=ta.value.trim();if(!t)return;hist.push({role:"user",content:t});hist.push({role:"assistant",content:"…"});A=null;render();let sm=null;try{sm=await claude.use("sample")}catch(e){}
const upd=x=>{hist[hist.length-1].content=x;const c=document.getElementById("ch");if(c){c.innerHTML=hist.map(h=>`<div class="msg ${h.role=="user"?"u":"a"}">${E(h.content)}</div>`).join("");c.scrollTop=1e9}};
if(!sm){upd("Der KI-Assistent ist hier nur verfügbar, wenn du die Seite in Claude geöffnet hast und angemeldet bist.");return}
const sys="Du bist der Lernassistent von AVELORA Nursing Academy für Auszubildende der deutschen generalistischen Pflegeausbildung. Antworte auf Deutsch, geduldig, verständlich, fachlich korrekt und kurz mit Beispielen. Du kannst Fachbegriffe erklären, Pflegeplanungen (PESR, SMART), Medikamentenrechnungen Schritt für Schritt, Prüfungsfragen und Fallbeispiele. Gib keine Dosierungs- oder Therapieempfehlungen für reale Patienten und verweise auf Hausstandards und ärztliche Anordnung.\n\n";
const msgs=hist.slice(0,-1).map((h,i,a)=>i==a.length-1?{role:"user",content:sys+h.content}:h);
try{await sm(msgs,{cache:false,onText:({text})=>upd(text)})}catch(e){upd("Die KI ist gerade nicht erreichbar. Bitte versuche es später erneut.")}}
setInterval(()=>{if(!document.hidden){S.mins++;save()}},60000);render();if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
